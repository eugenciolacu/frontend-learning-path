<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IndexedDB — Contact Manager Demo</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: system-ui, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
        min-height: 100vh;
        padding: 32px 16px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 28px;
      }

      h1 { font-size: 1.6rem; color: #7dd3fc; text-align: center; }
      p.subtitle { color: #94a3b8; max-width: 560px; text-align: center; font-size: 0.9rem; }

      .card {
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 12px;
        padding: 24px;
        width: 100%;
        max-width: 640px;
      }
      .card h2 { color: #7dd3fc; font-size: 1rem; margin-bottom: 16px; }

      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-bottom: 14px;
      }
      .form-full { grid-column: 1 / -1; }

      label { display: block; font-size: 0.8rem; color: #94a3b8; margin-bottom: 4px; }
      input {
        width: 100%;
        padding: 9px 12px;
        background: #0f172a;
        border: 1px solid #334155;
        border-radius: 8px;
        color: #e2e8f0;
        font-size: 0.9rem;
        outline: none;
        transition: border-color 0.2s;
      }
      input:focus { border-color: #2563eb; }
      input[readonly] { opacity: 0.6; cursor: not-allowed; }

      .btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
      button {
        padding: 9px 18px;
        border: none;
        border-radius: 8px;
        font-size: 0.88rem;
        cursor: pointer;
        font-weight: 600;
        transition: opacity 0.2s;
      }
      button:disabled { opacity: 0.4; cursor: not-allowed; }
      .btn-primary { background: #2563eb; color: #fff; }
      .btn-success { background: #15803d; color: #fff; }
      .btn-danger  { background: #dc2626; color: #fff; }
      .btn-neutral { background: #475569; color: #fff; }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.85rem;
      }
      th { padding: 8px 10px; text-align: left; color: #7dd3fc; border-bottom: 1px solid #334155; }
      td { padding: 8px 10px; border-bottom: 1px solid #1e293b; }
      tr:hover td { background: #1e293b; }

      .tag {
        padding: 2px 8px;
        border-radius: 12px;
        font-size: 0.72rem;
        font-weight: 700;
      }
      .tag-synced  { background: #14532d; color: #86efac; }
      .tag-pending { background: #713f12; color: #fde68a; }

      .action-btn {
        padding: 4px 10px;
        border: none;
        border-radius: 6px;
        font-size: 0.78rem;
        cursor: pointer;
        font-weight: 600;
        margin-right: 4px;
      }
      .edit-btn   { background: #1d4ed8; color: #fff; }
      .delete-btn { background: #991b1b; color: #fff; }

      #toast {
        position: fixed;
        bottom: 24px;
        right: 24px;
        padding: 12px 20px;
        border-radius: 10px;
        font-size: 0.88rem;
        font-weight: 600;
        opacity: 0;
        transition: opacity 0.3s;
        pointer-events: none;
        z-index: 999;
      }
      #toast.show { opacity: 1; }
      #toast.success { background: #14532d; color: #86efac; }
      #toast.error   { background: #7f1d1d; color: #fca5a5; }
      #toast.info    { background: #1e3a5f; color: #93c5fd; }

      .empty-state { color: #475569; text-align: center; padding: 24px; }
    </style>
  </head>
  <body>
    <h1>IndexedDB — Contact Manager</h1>
    <p class="subtitle">
      A fully offline-capable contact manager built on IndexedDB.
      Data persists across page reloads — no server required.
    </p>

    <!-- Form -->
    <div class="card">
      <h2 id="form-title">Add Contact</h2>
      <div class="form-grid">
        <div>
          <label for="field-name">Full Name *</label>
          <input id="field-name" type="text" placeholder="Alice Smith" />
        </div>
        <div>
          <label for="field-email">Email *</label>
          <input id="field-email" type="email" placeholder="alice@example.com" />
        </div>
        <div>
          <label for="field-phone">Phone</label>
          <input id="field-phone" type="tel" placeholder="+1 555-0100" />
        </div>
        <div>
          <label for="field-company">Company</label>
          <input id="field-company" type="text" placeholder="Acme Corp" />
        </div>
        <div class="form-full">
          <label for="field-id">ID (auto-generated)</label>
          <input id="field-id" type="text" readonly placeholder="Generated by IndexedDB" />
        </div>
      </div>
      <div class="btn-row">
        <button class="btn-primary" id="btn-save">Save Contact</button>
        <button class="btn-neutral" id="btn-cancel" style="display:none;">Cancel Edit</button>
        <button class="btn-neutral" id="btn-seed">Seed Sample Data</button>
        <button class="btn-danger"  id="btn-clear-db">Clear Database</button>
      </div>
    </div>

    <!-- Search -->
    <div class="card">
      <h2>Search Contacts</h2>
      <input id="search-input" type="text" placeholder="Search by name or email…" style="margin-bottom:0;" />
    </div>

    <!-- Contact list -->
    <div class="card">
      <h2 id="contacts-title">Contacts</h2>
      <div id="contacts-container">
        <p class="empty-state">Loading…</p>
      </div>
    </div>

    <div id="toast"></div>

    <script src="db.js"></script>
    <script src="main.js"></script>
  </body>
</html>
