<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Example 02 – Variables and Scope</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 780px;
        margin: 40px auto;
        padding: 0 20px;
        background: #f9f9f9;
        color: #222;
      }
      h1 { color: #2563eb; }
      h2 { color: #1e40af; margin-top: 28px; }
      button {
        padding: 10px 20px;
        margin: 6px 4px;
        font-size: 0.95rem;
        cursor: pointer;
        border: none;
        border-radius: 6px;
        background: #2563eb;
        color: #fff;
      }
      button:hover { background: #1d4ed8; }
      #output {
        margin-top: 20px;
        padding: 16px;
        background: #1e1e1e;
        color: #d4d4d4;
        border-radius: 8px;
        font-family: monospace;
        font-size: 0.92rem;
        min-height: 100px;
        white-space: pre-wrap;
      }
      .btn-group { margin: 8px 0; }
    </style>
  </head>
  <body>
    <h1>Example 02 – Variables and Scope</h1>
    <p>
      Click the buttons to run each demonstration. Open
      <strong>DevTools Console</strong> (F12) for detailed output.
    </p>

    <div class="btn-group">
      <button onclick="demoVar()">var behaviour</button>
      <button onclick="demoLet()">let behaviour</button>
      <button onclick="demoConst()">const behaviour</button>
    </div>
    <div class="btn-group">
      <button onclick="demoHoisting()">Hoisting</button>
      <button onclick="demoTDZ()">Temporal Dead Zone</button>
      <button onclick="demoScope()">Scope Chain</button>
      <button onclick="demoLoopScope()">Loop Scope</button>
    </div>

    <div id="output">Output will appear here…</div>

    <script src="variables.js" defer></script>
  </body>
</html>
