<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Example 03 – Data Types</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 780px;
        margin: 40px auto;
        padding: 0 20px;
        background: #f9f9f9;
        color: #222;
      }
      h1 { color: #2563eb; }
      button {
        padding: 10px 20px;
        margin: 6px 4px;
        font-size: 0.92rem;
        cursor: pointer;
        border: none;
        border-radius: 6px;
        background: #2563eb;
        color: #fff;
      }
      button:hover { background: #1d4ed8; }
      #output {
        margin-top: 20px;
        padding: 16px;
        background: #1e1e1e;
        color: #d4d4d4;
        border-radius: 8px;
        font-family: monospace;
        font-size: 0.92rem;
        min-height: 120px;
        white-space: pre-wrap;
      }
      .btn-row { margin: 6px 0; }
    </style>
  </head>
  <body>
    <h1>Example 03 – Data Types</h1>
    <p>Open <strong>DevTools Console</strong> (F12) alongside the on-page output.</p>

    <div class="btn-row">
      <button onclick="demoStrings()">Strings</button>
      <button onclick="demoNumbers()">Numbers</button>
      <button onclick="demoBooleans()">Booleans</button>
    </div>
    <div class="btn-row">
      <button onclick="demoNullUndefined()">null &amp; undefined</button>
      <button onclick="demoSymbol()">Symbol</button>
      <button onclick="demoBigInt()">BigInt</button>
    </div>
    <div class="btn-row">
      <button onclick="demoTypeof()">typeof</button>
      <button onclick="demoCoercion()">Type Coercion</button>
      <button onclick="demoExplicitConversion()">Explicit Conversion</button>
    </div>

    <div id="output">Output will appear here…</div>

    <script src="data-types.js" defer></script>
  </body>
</html>
