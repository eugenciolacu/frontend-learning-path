<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Call Stack Visualization</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Call Stack Visualization</h1>
      <p>Watch the call stack grow and shrink as functions are called and return.</p>
    </header>

    <main>
      <section class="controls">
        <button id="btn-simple" class="btn">Run Simple Call Chain</button>
        <button id="btn-recursive" class="btn">Run Safe Recursion (factorial)</button>
        <button id="btn-overflow" class="btn btn-danger">Trigger Stack Overflow</button>
        <button id="btn-clear" class="btn btn-secondary">Clear Log</button>
      </section>

      <section class="demo-area">
        <div class="stack-panel">
          <h2>Call Stack</h2>
          <p class="hint">Top of stack = currently executing</p>
          <div id="stack-visual" class="stack-visual">
            <div class="stack-empty">Stack is empty</div>
          </div>
        </div>

        <div class="log-panel">
          <h2>Execution Log</h2>
          <div id="log" class="log"></div>
        </div>
      </section>

      <section class="code-display">
        <h2>Code Being Executed</h2>
        <pre id="code-display" class="code-block">// Click a button above to see the code</pre>
      </section>
    </main>

    <script src="call-stack.js"></script>
  </body>
</html>
